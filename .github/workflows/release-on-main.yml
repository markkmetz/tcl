name: Release VSIX

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build and release VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Build VSIX
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          VSIX_FILE="${PACKAGE_NAME}-${VERSION}.vsix"

          npx vsce package --out "${VSIX_FILE}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "vsix=${VSIX_FILE}" >> "$GITHUB_OUTPUT"

      - name: Ensure version tag exists on current commit
        shell: bash
        run: |
          TAG="${{ steps.package.outputs.tag }}"
          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"

          if [[ -n "$REMOTE_SHA" ]]; then
            if [[ "$REMOTE_SHA" != "${GITHUB_SHA}" ]]; then
              echo "Tag ${TAG} already exists on ${REMOTE_SHA}, expected ${GITHUB_SHA}."
              exit 1
            fi
            echo "Tag ${TAG} already exists on current commit."
            exit 0
          fi

          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"

      - name: Create or update GitHub release with VSIX
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.package.outputs.tag }}"
          VSIX_FILE="${{ steps.package.outputs.vsix }}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${VSIX_FILE}" --clobber
          else
            gh release create "${TAG}" "${VSIX_FILE}" --title "${TAG}" --generate-notes
          fi
